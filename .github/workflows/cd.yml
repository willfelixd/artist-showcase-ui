name: CD — Deploy na Vercel

on:
  workflow_run:
    workflows: [ "CI — Frontend" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    name: Deploy na Vercel
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy na Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verificar saúde do frontend
        run: |
          sleep 20
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://artist-showcase-ui.vercel.app")
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Frontend respondendo (HTTP $RESPONSE)"
          else
            echo "❌ Frontend não responde (HTTP $RESPONSE)"
            exit 1
          fi